[project]
name = "assay-infra"
version = "0.1.0"
description = "Pulumi program for the assay-platform project"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pulumi>=3.200,<4",
    "pulumi-aws>=7,<8",
    "pulumi-command>=1.1,<2",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assay_infra"
module-root = ""
