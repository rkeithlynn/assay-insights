config:
  aws:region: us-east-1
  aws:profile: pilar-dev
  aws:allowedAccountIds:
    - "429100266783"
  aws:defaultTags:
    tags:
      app: assay-insights
      env: dev
  assay-platform:hostedZone: dev.assayinsights.ai
  assay-platform:tenantHost: dev.assayinsights.ai
  assay-platform:adminHost: admin.dev.assayinsights.ai
  assay-platform:vpcCidr: 10.40.0.0/16
  # Zone IDs, not names. Workloads and the interface endpoints run in workloadAzId, which
  # must offer every endpoint service in use (S3 Vectors is not offered in use1-az3).
  assay-platform:workloadAzId: use1-az2
  assay-platform:secondAzId: use1-az4
  assay-platform:dbEngineVersion: "17.11"
  assay-platform:dbName: assay
  assay-platform:dbMinAcu: "0"
  assay-platform:dbMaxAcu: "4"
  assay-platform:dbAutoPauseSeconds: "300"
  # Cognito managed login prefix domains (<prefix>.auth.us-east-1.amazoncognito.com).
  assay-platform:tenantAuthDomainPrefix: assay-dev-tenant
  assay-platform:platformAuthDomainPrefix: assay-dev-admin
  assay-platform:tenantRefreshTokenRotation: "true"
  # The only principal that may assume the break-glass role: the owner's IAM Identity Center
  # AdministratorAccess role. Production needs a separate, approval-gated role instead.
  assay-platform:breakGlassPrincipalArn: arn:aws:iam::429100266783:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_d20a664f5ea3111b
  # Amazon Titan Text Embeddings V2. Fixed when a tenant's vector index is created.
  assay-platform:vectorDimensions: "1024"
  # Deploys the in-VPC isolation test runner (tests/isolation). Development stacks only.
  assay-platform:isolationTests: "true"
  # Alarm notifications (break-glass use, failed tenant provisioning) are emailed here.
  # SNS sends a confirmation link first; nothing is delivered until it is followed.
  assay-platform:alarmEmail: keith.lynn@pilartech.com
  # Security notices (a quarantined upload) are emailed here, on their own topic, apart from
  # the alarms. Blank until you set it; SNS then sends a confirmation link at `pulumi up`,
  # to follow within 48 hours. Not used before build step 6, second half, part 2.
  assay-platform:securityNoticeEmail: "aws@pilartech.com"
  # The most worker tasks one tenant's documents may have running at once (1 to 50). A
  # document waits for a slot; it never fails for lack of one.
  assay-platform:workerMaxPerTenant: "5"
  # Lambda reserved concurrency (owner decision, 2026-11-25): a cap of 50 on the scan
  # function and a guaranteed 300 for the Tenant Storage Service. Set both or neither. They
  # need an account that allows at least 750 concurrent executions (these two, a full
  # batch's 200 steps and 200 for everything else); a new account allows 10, so raise the
  # quota first: `uv run scripts/check_deployment.py --before-deploy`.
  assay-platform:scanReservedConcurrency: "50"
  assay-platform:tssReservedConcurrency: "300"
  # AWS WAF on CloudFront: requests allowed per IP address in any 5-minute window.
  assay-platform:wafRateLimit: "1000"
  # The portal signs a user out after this many minutes without activity in any of its tabs,
  # with a warning 2 minutes before (both hosts; 5 to 480).
  assay-platform:portalIdleTimeoutMinutes: "60"
  # The model catalog (ai_models), loaded by scripts/seed.py as migrator through the migration
  # Lambda. Bedrock `us.` inference profiles only. Prices are US dollars per million tokens;
  # seed.py refuses to load the catalog while any price is blank.
  assay-platform:aiModels:
    - name: Claude Haiku 4.5
      profileId: us.anthropic.claude-haiku-4-5-20251001-v1:0
      jobs: [ingest, query]
      priceIn: "1.10"
      priceOut: "5.50"
    - name: Claude Sonnet 4.6
      profileId: us.anthropic.claude-sonnet-4-6
      jobs: [ingest, query]
      priceIn: "3.30"
      priceOut: "16.50"
    - name: Claude Opus 4.6
      profileId: us.anthropic.claude-opus-4-6-v1
      jobs: [ingest, query]
      priceIn: "5.50"
      priceOut: "27.50"
  # The models every new tenant starts with (section 7b). Must be aiModels profile IDs.
  assay-platform:defaultIngestModel: us.anthropic.claude-haiku-4-5-20251001-v1:0
  assay-platform:defaultQueryModel: us.anthropic.claude-sonnet-4-6
  # scripts/seed.py (section 5). Display names default to the email address.
  assay-platform:seed:
    platform:
      name: Assay Insights, LLC
      users:
        - email: keith.lynn@pilartech.com
          role: master-admin
        - email: robert@pilartech.com
          role: master-user
    tenants:
      - name: Global Finance, Inc
        admin: robert@ugafamily.com
        users:
          - email: robertreg@ugafamily.com
            role: tenant-user
      - name: Infinity Loans
        admin: me@keithlynn.com
        users:
          - email: keith@keithlynn.com
            role: tenant-user
