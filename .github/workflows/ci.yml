name: CI

# Checks only. This workflow never deploys (BUILD_SPEC.md section 3).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL for the role, RLS and migration tests (tests/unit/test_db_security.py).
    # Same major version as Aurora (dbEngineVersion); pinned by digest.
    services:
      postgres:
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf # 17.12
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASSAY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Fail, rather than skip, if the database tests cannot run.
      ASSAY_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

      - name: Dependency audit
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r infra db scripts
