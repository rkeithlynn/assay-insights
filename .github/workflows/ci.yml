name: CI

# Checks only. This workflow never deploys (BUILD_SPEC.md section 3).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

      - name: Dependency audit
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r infra
