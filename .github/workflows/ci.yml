name: CI

# Checks only. This workflow never deploys (BUILD_SPEC.md section 3).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL for the role, RLS and migration tests (tests/unit/test_db_security.py).
    # Same major version as Aurora (dbEngineVersion); pinned by digest.
    services:
      postgres:
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf # 17.12
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASSAY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      # Fail, rather than skip, if the database or image tests cannot run.
      ASSAY_REQUIRE_DB_TESTS: "1"
      # tests/unit/test_migrate_image.py builds db/Dockerfile and runs it as a non-root user.
      ASSAY_REQUIRE_IMAGE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

      - name: Dependency audit
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r api infra db scripts tss

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Node release as portal/Dockerfile's pinned image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install (locked, no install scripts)
        run: npm ci --ignore-scripts

      - name: API types match the committed OpenAPI schema
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (what ships in the portal)
        run: npm audit --omit=dev --audit-level=low

  # The built portal rendered in headless Chromium at 1280 and 1800 px wide (portal/e2e):
  # banner, navigation and every dropdown on every screen of both hosts. jsdom has no layout,
  # so the unit tests above cannot see these. Same image and steps as
  # `uv run scripts/check_portal_render.py`.
  portal-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Playwright v1.64.1-noble (Node 26). Its version must equal @playwright/test in
      # portal/package.json (tests/unit/test_portal_render.py).
      image: mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install (locked, no install scripts)
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Production build
        run: npx vite build --logLevel warn

      - name: Rendered layout checks
        run: npx playwright test
        env:
          PORTAL_RENDER_OUT: ${{ runner.temp }}/portal-render
