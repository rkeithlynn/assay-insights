[project]
name = "assay-workers"
version = "0.1.0"
description = "Assay Insights ingestion pipeline: Lambda handlers (and, from the second half of build step 6, the Fargate worker)"
requires-python = ">=3.14,<3.15"
# Upper bounds keep releases younger than two weeks out; raise them deliberately.
dependencies = [
    "assay-db",
    "assay-schemas",
    "assay-tss",
    "aws-lambda-powertools>=3.39,<3.40",
    "boto3>=1.40",
    "pypdfium2>=5.15.2,<5.16",
]

[tool.uv.sources]
assay-db = { workspace = true }
assay-schemas = { workspace = true }
assay-tss = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assay_workers"
module-root = ""
