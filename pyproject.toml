[project]
name = "assay-insights"
version = "0.1.0"
description = "Assay Insights: multi-tenant AI search over signed loan document archives"
requires-python = ">=3.14,<3.15"
dependencies = ["assay-db", "assay-infra"]

[tool.uv]
package = false
# Never use the Python installed on the machine (BUILD_SPEC.md section 2).
python-preference = "only-managed"

[tool.uv.sources]
assay-db = { workspace = true }
assay-infra = { workspace = true }

[tool.uv.workspace]
members = ["db", "infra"]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "boto3-stubs[ecr,lambda,rds,secretsmanager]>=1.40",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["portal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]

[tool.ruff.format]
# Markdown (including BUILD_SPEC.md) is prose and is never reformatted.
exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = ["assay_db", "assay_infra", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S608"]
# Autogenerated DDL keeps the CHECK constraint text on one line.
"db/assay_db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["db", "infra", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["db", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = [".venv", "tests", "portal"]
