[project]
name = "assay-insights"
version = "0.1.0"
description = "Assay Insights: multi-tenant AI search over signed loan document archives"
requires-python = ">=3.14,<3.15"
dependencies = ["assay-api", "assay-db", "assay-infra"]

[tool.uv]
package = false
# Never use the Python installed on the machine (BUILD_SPEC.md section 2).
python-preference = "only-managed"

[tool.uv.sources]
assay-api = { workspace = true }
assay-db = { workspace = true }
assay-infra = { workspace = true }

[tool.uv.workspace]
members = ["api", "db", "infra"]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "boto3-stubs[cognito-idp,ecr,lambda,rds,secretsmanager]>=1.40",
    # Starlette's TestClient. Starlette 1.10 still supports httpx in this range (its `full`
    # extra); httpx2 is not published by the httpx maintainers, so it is not used.
    "httpx>=0.27,<0.29",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["portal"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]

[tool.ruff.format]
# Markdown (including BUILD_SPEC.md) is prose and is never reformatted.
exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = ["assay_api", "assay_db", "assay_infra", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests build fake tokens and signing keys on purpose.
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S608"]
# Autogenerated DDL keeps the CHECK constraint text on one line.
"db/assay_db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["api", "db", "infra", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["api", "db", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
# Starlette deprecates httpx in favour of httpx2 but still supports it; see pyproject's
# dev dependencies. Only this one warning is silenced.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "portal"]
