[project]
name = "assay-db"
version = "0.1.0"
description = "Assay Insights database: SQLAlchemy models, Alembic migrations, roles and RLS"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.40",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.40,<2.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assay_db"
module-root = ""
